name: iOS build (unsigned IPA)

# Builds an unsigned .ipa on a GitHub-hosted Mac. Sign and install it from
# Windows with Sideloadly (free Apple ID) — see TESTING.md / chat notes.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry TraceAR-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TraceAR-unsigned-ipa
          path: build/ipa/TraceAR-unsigned.ipa
          retention-days: 14
