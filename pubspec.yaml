name: tracear
description: "An app for tracing pictures onto paper using live camera overlay."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.2
  crypto: ^3.0.8
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  gal: ^3.0.1
  go_router: ^18.1.4
  image: ^4.13.1
  image_picker: ^1.2.4
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  video_player: ^2.14.1
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
    - assets/templates/cat/
    - assets/templates/dog/
    - assets/templates/owl/
    - assets/templates/fish/
    - assets/templates/butterfly/
    - assets/templates/bird/
    - assets/templates/tulip/
    - assets/templates/sunflower/
    - assets/templates/rose/
    - assets/templates/tree/
    - assets/templates/house/
    - assets/templates/car/
    - assets/templates/rocket/
    - assets/templates/sailboat/
    - assets/templates/apple/
    - assets/templates/cup/
    - assets/templates/face/
    - assets/templates/star/
    - assets/templates/heart/
    - assets/templates/letter_a/
